<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Comptoir Boursier</title>
<style>
  :root{
    --bg:#0F1B18; --bg-soft:#152420; --surface:#1B2E28; --surface-hi:#243D35;
    --border:#365349; --gold:#3ECF8E; --gold-soft:#8FE6BC; --blush:#F2A65A;
    --cream:#EAF3EF; --muted:#8FA79D; --pos:#3ECF8E; --neg:#E2685C; --live:#3ECF8E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;
    display:flex; justify-content:center;
  }
  .mono{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  #app{ width:100%; max-width:460px; min-height:100vh; position:relative; padding-bottom:90px; }
  #app.wide{ max-width:900px; padding-bottom:40px; }
  .header{ text-align:center; padding:24px 20px 8px; }
  .header.wide-header{ text-align:left; display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:24px 20px 0; }
  .eyebrow{ font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold); margin:0 0 6px; }
  h1{ font-family:Georgia,serif; font-weight:400; font-size:22px; margin:0; letter-spacing:.02em; }
  .subtitle{ font-size:12px; color:var(--muted); margin:6px 0 0; }
  .live-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--live); border:1px solid rgba(62,207,142,.35); background:rgba(62,207,142,.08); padding:4px 10px; border-radius:999px; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--live); animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .disclaimer{
    margin:14px 20px; padding:9px 12px; border-radius:12px; font-size:11px;
    background:rgba(62,207,142,.1); border:1px solid var(--border); color:var(--gold-soft);
    display:flex; gap:8px; align-items:center;
  }
  .content{ padding:0 20px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:12px; }
  .hero-card{ background:linear-gradient(135deg,var(--surface-hi),var(--surface)); border:1px solid rgba(62,207,142,.33); border-radius:18px; padding:20px; margin-bottom:16px; }
  .muted{ color:var(--muted); font-size:12px; }
  .netvalue{ font-family:Georgia,serif; font-size:30px; color:var(--gold); }
  .row{ display:flex; align-items:center; justify-content:space-between; }
  .badge{ font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:4px; }
  .badge.up{ color:var(--pos); background:rgba(62,207,142,.12); }
  .badge.down{ color:var(--neg); background:rgba(226,104,92,.12); }
  .stat-row{ display:flex; gap:24px; margin-top:14px; }
  .cta{ width:100%; border:none; border-radius:16px; padding:14px; font-size:15px; font-weight:600; background:var(--gold); color:var(--bg); cursor:pointer; }
  .stock-item{ padding:14px; border-bottom:1px solid var(--border); cursor:pointer; }
  .stock-item:last-child{ border-bottom:none; }
  .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:10px; flex-shrink:0; }
  .stock-top{ display:flex; align-items:center; justify-content:space-between; }
  .stock-name{ font-size:14px; }
  .stock-meta{ font-size:11px; color:var(--muted); margin-top:2px; }
  .stock-right{ text-align:right; }
  .stock-detail{ margin-top:12px; padding-top:12px; border-top:1px solid var(--border); }
  .qty-control{ display:flex; align-items:center; gap:10px; }
  .qty-btn{ width:30px; height:30px; border-radius:50%; border:none; background:var(--surface-hi); color:var(--cream); font-size:16px; cursor:pointer; }
  .buy-btn{ width:100%; margin-top:12px; border:none; border-radius:12px; padding:10px; font-weight:600; background:var(--gold); color:var(--bg); cursor:pointer; }
  .buy-btn:disabled{ opacity:.4; }
  .sell-btn{ border:1px solid var(--gold); color:var(--gold); background:transparent; border-radius:12px; padding:8px 16px; font-size:13px; cursor:pointer; }
  .empty{ text-align:center; padding-top:60px; color:var(--muted); }
  .tx-item{ padding:10px 14px; }
  .reset-btn{ width:100%; border:1px solid var(--border); background:var(--surface-hi); color:var(--neg); border-radius:16px; padding:12px; font-size:13px; cursor:pointer; margin-top:10px; }
  .swap-btn{ width:100%; border:1px solid var(--border); background:transparent; color:var(--muted); border-radius:16px; padding:12px; font-size:13px; cursor:pointer; margin-top:8px; }
  .navbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:460px;
    padding:0 16px 16px;
  }
  .navbar-inner{
    display:flex; justify-content:space-around; background:var(--surface-hi); border:1px solid var(--border);
    border-radius:999px; padding:10px 0; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .nav-btn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:10px; cursor:pointer; }
  .nav-btn.active{ color:var(--gold); }
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--surface-hi);
    border:1px solid var(--gold); color:var(--cream); padding:10px 18px; border-radius:999px; font-size:13px;
    opacity:0; transition:opacity .3s; pointer-events:none; z-index:50;
  }
  #app.wide .toast{ bottom:24px; }
  .toast.show{ opacity:1; }
  svg.icon{ width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2; }
  .center-wrap{ min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:20px; }
  .login-card{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:26px 22px; }
  .login-input{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border); background:var(--bg-soft);
    color:var(--cream); font-size:15px; margin-top:14px; margin-bottom:16px;
  }
  .login-input:focus{ outline:none; border-color:var(--gold); }
  .loading-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; }
  .role-btn{ width:100%; border:1px solid var(--border); background:var(--surface); color:var(--cream); border-radius:16px; padding:16px; font-size:14px; cursor:pointer; margin-top:12px; text-align:left; }
  .role-btn .role-title{ font-size:15px; }
  .role-btn .role-desc{ font-size:12px; color:var(--muted); margin-top:3px; }
  .link-btn{ background:none; border:none; color:var(--muted); font-size:12px; cursor:pointer; text-decoration:underline; margin-top:22px; }

  /* --- écrans administrateur --- */
  .a-warn{ font-size:11px; color:var(--gold-soft); background:rgba(62,207,142,.08); border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin:14px 20px; }
  .a-tabs{ display:flex; gap:6px; margin:18px 20px 16px; border-bottom:1px solid var(--border); }
  .a-tab-btn{ background:none; border:none; color:var(--muted); font-size:13px; padding:10px 4px; margin-right:18px; cursor:pointer; border-bottom:2px solid transparent; }
  .a-tab-btn.active{ color:var(--gold); border-bottom-color:var(--gold); }
  .a-stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px; }
  .a-stat-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .a-stat-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .a-stat-value{ font-size:20px; margin-top:6px; }
  .a-section-title{ font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:22px 0 10px; }
  .a-trainee-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .a-trainee-top{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; cursor:pointer; }
  .a-trainee-meta{ font-size:11px; color:var(--muted); margin-top:2px; }
  .a-trainee-detail{ border-top:1px solid var(--border); padding:14px 16px; background:var(--bg-soft); }
  .a-mini-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .a-mini-table th{ text-align:left; color:var(--muted); font-weight:500; padding:4px 6px; font-size:10px; text-transform:uppercase; letter-spacing:.04em; }
  .a-mini-table td{ padding:6px; border-top:1px solid var(--border); }
  .a-danger-btn{ border:1px solid var(--neg); color:var(--neg); background:transparent; border-radius:10px; padding:6px 12px; font-size:12px; cursor:pointer; }
  .a-field-label{ font-size:12px; color:var(--muted); display:block; margin-bottom:5px; }
  .a-field-input{ width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:var(--bg-soft); color:var(--cream); font-size:14px; }
  .a-field-input:focus{ outline:none; border-color:var(--gold); }
  .a-field-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:14px; }
  .a-stock-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .a-stock-table th{ text-align:left; font-size:10px; text-transform:uppercase; color:var(--muted); padding:6px 5px; letter-spacing:.04em; }
  .a-stock-table td{ padding:5px; border-top:1px solid var(--border); }
  .a-cell-input{ width:100%; padding:7px 8px; border-radius:8px; border:1px solid var(--border); background:var(--bg-soft); color:var(--cream); font-size:12px; }
  .a-icon-btn{ background:none; border:none; color:var(--neg); cursor:pointer; font-size:16px; padding:2px 6px; }
  .a-add-row-btn{ background:none; border:1px dashed var(--border); color:var(--muted); border-radius:10px; padding:8px 12px; font-size:12px; cursor:pointer; margin-top:8px; width:100%; }
  .a-primary-btn{ border:none; border-radius:12px; padding:12px 18px; font-size:14px; font-weight:600; background:var(--gold); color:var(--bg); cursor:pointer; }
  .a-ghost-btn{ border:1px solid var(--border); border-radius:12px; padding:12px 18px; font-size:13px; background:transparent; color:var(--cream); cursor:pointer; }
  .a-btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   CONFIGURATION — changez ce code pour protéger l'accès administrateur
   ========================================================================= */
const ADMIN_PASSCODE = "formateur2026";

/* ---------------- CONFIGURATION PAR DÉFAUT DU MARCHÉ ---------------- */
const DEFAULT_CONFIG = {
  stocks: [
    { symbol:"LUM", name:"Lumière Éclat", sector:"Maquillage", price:4200 },
    { symbol:"VLR", name:"Velours Noir", sector:"Parfum", price:15800 },
    { symbol:"ORB", name:"Or Rose Beauté", sector:"Soin", price:9600 },
    { symbol:"NCS", name:"Nacre & Soie", sector:"Capillaire", price:3100 },
    { symbol:"AMB", name:"Ambre Doré", sector:"Parfum", price:21000 },
    { symbol:"PIV", name:"Pivoine Sauvage", sector:"Soin", price:5400 },
    { symbol:"CDN", name:"Cristal de Nuit", sector:"Maquillage", price:7300 },
    { symbol:"IVS", name:"Ivoire Sublime", sector:"Capillaire", price:2600 },
  ],
  startCash: 500000,
  tickIntervalSec: 4,
  volatility: 0.06,
  showLeaderboard: true,
  marketStartTime: new Date().toISOString(),
  updatedAt: new Date().toISOString(),
};
const SECTOR_FALLBACK = { Parfum:"#F2A65A", Soin:"#3ECF8E", Maquillage:"#E88FA0", Capillaire:"#B98AE0" };

/* ---------------- ÉTAT GLOBAL ---------------- */
let screen = "role";        // role | adminAuth | login | loading | app | admin
let adminError = "", loginError = "";
let config = null;

// stagiaire
let myId = null, myName = null, trainee = null;
let traineeTab = "accueil", expanded = null, qty = 1, sellQtyMap = {};
let traineeTickTimer = null, traineePollTimer = null;
let leaderboard = [];

// administrateur
let adminTab = "stagiaires";
let trainees = [];
let expandedTrainee = null;
let adminSearch = "";
let draft = null;
let adminRefreshTimer = null;
let adminMessages = [];

/* ---------------- UTILITAIRES ---------------- */
function fmt(n){ return Math.round(n).toLocaleString("fr-FR") + " XOF"; }
function pct(n){ return (n>=0?"+":"") + n.toFixed(2) + " %"; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function slugify(s){
  return String(s).trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "invite";
}
function timeAgo(ts){
  const s = Math.max(0, Math.floor((Date.now()-ts)/1000));
  if(s<60) return `il y a ${s}s`;
  if(s<3600) return `il y a ${Math.floor(s/60)} min`;
  return `il y a ${Math.floor(s/3600)} h`;
}
function sectorColor(sector){
  if(SECTOR_FALLBACK[sector]) return SECTOR_FALLBACK[sector];
  const h = Math.abs(hashString(sector)) % 360;
  return `hsl(${h}, 45%, 65%)`;
}
function hashString(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i)) | 0; }
  return h;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
async function hashPin(id, pin){
  const data = new TextEncoder().encode("comptoir-boursier|" + id + "|" + pin);
  const digest = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2,"0")).join("");
}

/* ---------------- MARCHÉ (déterministe, partagé par tout le monde) ---------------- */
function currentTick(){
  const start = new Date(config.marketStartTime).getTime();
  const interval = Math.max(1, config.tickIntervalSec) * 1000;
  return Math.max(0, Math.floor((Date.now() - start) / interval));
}
function priceHistoryFull(stock, uptoTick){
  const rng = mulberry32(hashString(stock.symbol + "|" + config.marketStartTime));
  const first = stock.price;
  let price = first;
  const history = [price];
  const vol = config.volatility ?? 0.06;
  for(let i=0;i<uptoTick;i++){
    const drift = (rng()-0.5)*vol;
    const meanPull = (first-price)/first*0.02;
    let next = price*(1+drift+meanPull);
    next = Math.max(next, price*0.85);
    next = Math.round(next);
    price = next;
    history.push(next);
  }
  return history;
}
function priceOnly(stock, uptoTick){ return priceHistoryFull(stock, uptoTick).at(-1); }
function liveStocksWithHistory(){
  const tick = currentTick();
  return config.stocks.map(s => {
    const full = priceHistoryFull(s, tick);
    return { ...s, price: full.at(-1), history: full.slice(-40) };
  });
}
function liveStocksPriceOnly(){
  const tick = currentTick();
  return config.stocks.map(s => ({ ...s, price: priceOnly(s, tick) }));
}

/* ---------------- COMMUNICATION AVEC LE SERVEUR ---------------- */
// Laissez API_BASE vide si cette page est servie par le même serveur que l'API
// (c'est le cas si vous utilisez server.js tel quel). Sinon, mettez l'URL
// complète de votre serveur, ex : "https://mon-serveur.exemple.com"
const API_BASE = "";
async function apiGet(path){
  const res = await fetch(API_BASE + path);
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
async function apiPut(path, body){
  const res = await fetch(API_BASE + path, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
async function apiDelete(path){
  const res = await fetch(API_BASE + path, { method: "DELETE" });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
// Ces trois fonctions envoient le code administrateur au serveur, qui vérifie
// lui-même sa validité — donc même en devinant l'adresse d'une fonction, un
// visiteur ne peut pas changer les paramètres ou effacer des stagiaires
// sans connaître le vrai code.
async function apiAdminGet(path){
  const res = await fetch(API_BASE + path, { headers:{ "x-admin-passcode": ADMIN_PASSCODE } });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
async function apiAdminPut(path, body){
  const res = await fetch(API_BASE + path, {
    method: "PUT",
    headers: { "Content-Type": "application/json", "x-admin-passcode": ADMIN_PASSCODE },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
async function apiAdminDelete(path){
  const res = await fetch(API_BASE + path, { method:"DELETE", headers:{ "x-admin-passcode": ADMIN_PASSCODE } });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
async function apiPost(path, body){
  const res = await fetch(API_BASE + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}
async function apiAdminPutNoBody(path){
  const res = await fetch(API_BASE + path, { method:"PUT", headers:{ "x-admin-passcode": ADMIN_PASSCODE } });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}

/* ---------------- STOCKAGE PARTAGÉ (via le serveur) ---------------- */
async function ensureConfig(){
  try{
    config = await apiGet("/api/config");
  }catch(e){
    config = { ...DEFAULT_CONFIG, marketStartTime: new Date().toISOString() };
    try{ await apiPut("/api/config", { config, restart:false }); }catch(e2){}
  }
}

/* =========================================================================
   ÉCRAN DE DÉPART — choix du rôle
   ========================================================================= */
function renderRoleScreen(){
  return `
  <div class="center-wrap">
    <p class="eyebrow" style="text-align:center;">Le Comptoir Boursier</p>
    <h1 style="text-align:center;margin-bottom:20px;">Simulateur boursier</h1>
    <button class="role-btn" onclick="goToLogin()">
      <div class="role-title">🎓 Je suis stagiaire</div>
      <div class="role-desc">Rejoindre la simulation et m'entraîner à investir.</div>
    </button>
    <button class="role-btn" onclick="goToAdminAuth()">
      <div class="role-title">🛠️ Espace administrateur</div>
      <div class="role-desc">Suivre les stagiaires et régler les paramètres du marché.</div>
    </button>
  </div>`;
}
function goToLogin(){ screen="login"; loginError=""; render(); }
function goToAdminAuth(){ screen="adminAuth"; adminError=""; render(); }
function goToRole(){ stopTraineeLoops(); stopAdminRefresh(); screen="role"; render(); }
window.goToLogin=goToLogin; window.goToAdminAuth=goToAdminAuth; window.goToRole=goToRole;

function renderAdminAuthScreen(){
  return `
  <div class="center-wrap">
    <p class="eyebrow" style="text-align:center;">Accès protégé</p>
    <h1 style="text-align:center;margin-bottom:20px;">Espace administrateur</h1>
    <div class="login-card">
      <p class="muted">Entrez le code administrateur.</p>
      <input id="passcode-input" class="login-input" type="password" placeholder="Code d'accès" onkeydown="if(event.key==='Enter')checkAdminPasscode(this.value)"/>
      ${adminError?`<p style="color:var(--neg);font-size:12px;margin:-10px 0 12px;">${esc(adminError)}</p>`:""}
      <button class="cta" onclick="checkAdminPasscode(document.getElementById('passcode-input').value)">Entrer</button>
      <button class="link-btn" onclick="goToRole()">← Retour</button>
    </div>
  </div>`;
}
async function checkAdminPasscode(value){
  if(value !== ADMIN_PASSCODE){ adminError = "Code incorrect."; render(); return; }
  screen = "loading"; render();
  await ensureConfig();
  await loadTrainees();
  await loadMessages();
  draft = structuredClone(config);
  screen = "admin"; adminTab = "stagiaires";
  startAdminRefresh();
  render();
}
window.checkAdminPasscode=checkAdminPasscode;

/* =========================================================================
   CÔTÉ STAGIAIRE
   ========================================================================= */
async function loadOrCreateTrainee(pinHash, phone){
  let existing = null;
  try{ existing = await apiGet("/api/trainee/" + encodeURIComponent(myId)); }catch(e){ existing = null; }
  if(existing){
    if(existing.pinHash !== pinHash) return "wrong-pin";
    trainee = existing;
    return "ok";
  }
  trainee = { id:myId, name:myName, pinHash, phone: phone||"", cash:config.startCash, holdings:{}, transactions:[], createdAt:Date.now(), updatedAt:Date.now() };
  await saveTrainee();
  return "ok";
}
async function saveTrainee(){
  trainee.updatedAt = Date.now();
  try{ await apiPut("/api/trainee/" + encodeURIComponent(myId), trainee); }
  catch(e){ console.error("Erreur de sauvegarde", e); }
}
async function startSession(name, pin, phone){
  const clean = (name||"").trim();
  const cleanPin = (pin||"").trim();
  if(!clean){ loginError = "Entrez un pseudo pour continuer."; render(); return; }
  if(!/^\d{4}$/.test(cleanPin)){ loginError = "Le code PIN doit contenir exactement 4 chiffres."; render(); return; }
  myName = clean; myId = slugify(clean);
  screen = "loading"; render();
  await ensureConfig();
  const pinHash = await hashPin(myId, cleanPin);
  const result = await loadOrCreateTrainee(pinHash, (phone||"").trim());
  if(result === "wrong-pin"){
    myId = null; myName = null;
    screen = "login";
    loginError = "Ce pseudo est déjà utilisé avec un autre code PIN. Choisissez un autre pseudo, ou entrez le bon code.";
    render(); return;
  }
  screen = "app"; traineeTab = "accueil";
  startTraineeLoops();
  render();
}
function switchTrainee(){
  if(!confirm("Changer de stagiaire ? Votre progression reste enregistrée sous votre pseudo.")) return;
  stopTraineeLoops();
  myId=null; myName=null; trainee=null; expanded=null; traineeTab="accueil";

function portfolioValue(stocks){
  return stocks.reduce((sum,s)=>{
    const h = trainee.holdings[s.symbol];
    return sum + (h ? h.qty*s.price : 0);
  },0);
}
function netWorth(stocks){ return trainee.cash + portfolioValue(stocks); }

async function buy(symbol, quantity){
  const stocks = liveStocksWithHistory();
  const s = stocks.find(x=>x.symbol===symbol);
  const cost = s.price * quantity;
  if(quantity < 1 || cost > trainee.cash){ showToast("Solde virtuel insuffisant."); return; }
  const existing = trainee.holdings[symbol];
  const newQty = (existing?existing.qty:0) + quantity;
  const newAvg = existing ? (existing.avgCost*existing.qty + cost)/newQty : s.price;
  trainee.holdings[symbol] = { qty:newQty, avgCost:newAvg };
  trainee.cash -= cost;
  trainee.transactions.unshift({ id:Date.now(), day:currentTick()+1, type:"achat", symbol, name:s.name, qty:quantity, price:s.price, total:cost });
  trainee.transactions = trainee.transactions.slice(0,60);
  qty = 1;
  await saveTrainee(); render();
  showToast(`Achat de ${quantity} × ${s.name}`);
}
async function sell(symbol, quantity){
  const stocks = liveStocksWithHistory();
  const s = stocks.find(x=>x.symbol===symbol);
  const h = trainee.holdings[symbol];
  if(!h || quantity<1 || quantity>h.qty){ showToast("Quantité invalide."); return; }
  const proceeds = s.price*quantity;
  const remaining = h.qty - quantity;
  if(remaining<=0) delete trainee.holdings[symbol];
  else trainee.holdings[symbol] = { ...h, qty:remaining };
  trainee.cash += proceeds;
  trainee.transactions.unshift({ id:Date.now(), day:currentTick()+1, type:"vente", symbol, name:s.name, qty:quantity, price:s.price, total:proceeds });
  trainee.transactions = trainee.transactions.slice(0,60);
  await saveTrainee(); render();
  showToast(`Vente de ${quantity} × ${s.name}`);
}
async function resetGame(){
  if(!confirm("Réinitialiser votre partie et repartir avec le solde de départ ?")) return;
  trainee = { id:myId, name:myName, pinHash:trainee.pinHash, phone:trainee.phone||"", cash:config.startCash, holdings:{}, transactions:[], createdAt:Date.now(), updatedAt:Date.now() };
  traineeTab = "accueil";

async function sendMessageToAdmin(text){

}

/* ---------------- MINI GRAPHIQUES SVG ---------------- */
function sparkline(data, color, w=64, h=28){
  if(!data || data.length<2) return `<svg width="${w}" height="${h}"></svg>`;
  const min = Math.min(...data), max = Math.max(...data), range = (max-min)||1;
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((v-min)/range)*(h-4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}
function fullChart(data, color, w=300, h=110){
  if(!data || data.length<2) return `<svg width="${w}" height="${h}"></svg>`;
  const min = Math.min(...data), max = Math.max(...data), range=(max-min)||1;
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - ((v-min)/range)*(h-10) - 5;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function exportTraineesCSV(){
  const stocks = liveStocksWithHistory();
  const header = "Pseudo;Téléphone;Liquidités;Valeur du portefeuille;Valeur nette;Nombre de transactions\n";
  const rows = trainees.map(t=>{
    const pv = stocks.reduce((sum,s)=>{ const h=t.holdings?.[s.symbol]; return sum + (h?h.qty*s.price:0); },0);
    const nw = t.cash + pv;
    return [t.name, t.phone||"", Math.round(t.cash), Math.round(pv), Math.round(nw), (t.transactions||[]).length].join(";");
  }).join("\n");
  const blob = new Blob([header + rows], { type:"text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "comptoir-boursier-stagiaires.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function startAdminRefresh(){
  clearInterval(adminRefreshTimer);
  adminRefreshTimer = setInterval(async ()=>{
    if(screen!=="admin") return;
    if(adminTab==="stagiaires") await loadTrainees();
    await loadMessages();
    render();
  }, 5000);
}
function stopAdminRefresh(){ clearInterval(adminRefreshTimer); }
async function loadMessages(){
  try{ adminMessages = await apiAdminGet("/api/messages"); }
  catch(e){ adminMessages = []; }
}
async function markMessageRead(id){
  try{ await apiAdminPutNoBody("/api/message/" + encodeURIComponent(id)); }catch(e){}
  await loadMessages(); render();
}
async function deleteMessage(id){
  try{ await apiAdminDelete("/api/message/" + encodeURIComponent(id)); }catch(e){}
  await loadMessages(); render();
}
async function deleteAllMessages(){
  if(!confirm("Supprimer tous les messages reçus ?")) return;
  try{ await apiAdminDelete("/api/messages"); }catch(e){}
  await loadMessages(); render();
  showToast("Messages supprimés.");
}

function trainNetWorth(t, stocks){
  const pv = Object.entries(t.holdings||{}).reduce((sum,[sym,h])=>{
    const s = stocks.find(x=>x.symbol===sym);
    return sum + (s? s.price*h.qty : 0);
  },0);
  return t.cash + pv;
}

function setAdminTab(t){
  adminTab=t;
  if(t==="parametres") draft = structuredClone(config);
  if(t==="messages") loadMessages().then(render);
  render();
}
function setAdminSearch(v){ adminSearch = v; render(); }
function toggleTrainee(id){ expandedTrainee = expandedTrainee===id? null : id; render(); }
function updateDraftField(field, value){
  if(field==="startCash") draft.startCash = Math.max(0, Number(value)||0);
  if(field==="tickIntervalSec") draft.tickIntervalSec = Math.max(1, Number(value)||1);
  if(field==="volatility") draft.volatility = Math.max(0, Math.min(1, Number(value)||0));
  if(field==="showLeaderboard") draft.showLeaderboard = !!value;
  render();
}
function updateStockField(idx, field, value){
  const s = draft.stocks[idx];
  if(field==="price") s.price = Math.max(1, Number(value)||1);
  else s[field] = value;
  render();
}
function addStockRow(){ draft.stocks.push({ symbol:"NEW", name:"Nouvelle Action", sector:"Soin", price:1000 }); render(); }
function removeStockRow(idx){ draft.stocks.splice(idx,1); render(); }
function saveDraft(restart){
  const symbols = draft.stocks.map(s=>s.symbol.trim().toUpperCase());
  if(symbols.some(s=>!s)){ showToast("Chaque action doit avoir un symbole."); return; }
  if(new Set(symbols).size !== symbols.length){ showToast("Les symboles doivent être uniques."); return; }
  draft.stocks = draft.stocks.map((s,i)=>({ ...s, symbol:symbols[i] }));
  saveConfig(draft, restart);
}
window.setAdminTab=setAdminTab; window.toggleTrainee=toggleTrainee; window.updateDraftField=updateDraftField;
window.updateStockField=updateStockField; window.addStockRow=addStockRow; window.removeStockRow=removeStockRow;
window.saveDraft=saveDraft; window.deleteTrainee=deleteTrainee; window.deleteAllTrainees=deleteAllTrainees;
window.setAdminSearch=setAdminSearch; window.refreshTrainees=refreshTrainees; window.exportTraineesCSV=exportTraineesCSV;
window.updateTraineePhone=updateTraineePhone;
window.loadMessages=loadMessages; window.markMessageRead=markMessageRead; window.deleteMessage=deleteMessage; window.deleteAllMessages=deleteAllMessages;

function renderStagiairesTab(){
  const stocks = liveStocksPriceOnly();
  const searched = adminSearch.trim()
    ? trainees.filter(t => t.name.toLowerCase().includes(adminSearch.trim().toLowerCase()))
    : trainees;
  const withNw = searched.map(t=>({ t, nw: trainNetWorth(t, stocks) })).sort((a,b)=>b.nw-a.nw);
  const avgNw = trainees.length? trainees.reduce((s,t)=>s+trainNetWorth(t,stocks),0)/trainees.length : 0;
  const active5 = trainees.filter(t=>Date.now()-t.updatedAt < 5*60*1000).length;

  const statCards = `
  <div class="a-stat-grid">
    <div class="a-stat-card"><div class="a-stat-label">Stagiaires</div><div class="a-stat-value mono">${trainees.length}</div></div>
    <div class="a-stat-card"><div class="a-stat-label">Actifs (5 min)</div><div class="a-stat-value mono">${active5}</div></div>
    <div class="a-stat-card"><div class="a-stat-label">Valeur nette moyenne</div><div class="a-stat-value mono">${fmt(avgNw)}</div></div>
    <div class="a-stat-card"><div class="a-stat-label">Jour boursier</div><div class="a-stat-value mono">${currentTick()+1}</div></div>
  </div>
  <div class="a-btn-row" style="margin-bottom:14px;">
    <input class="a-field-input" style="flex:1;min-width:160px;" placeholder="Rechercher un stagiaire…" value="${esc(adminSearch)}" oninput="setAdminSearch(this.value)"/>
    <button class="a-ghost-btn" onclick="refreshTrainees()">${ICONS.reset} Actualiser</button>
    <button class="a-ghost-btn" onclick="exportTraineesCSV()">Exporter en CSV</button>
  </div>`;

  if(trainees.length===0){
    return `${statCards}<div class="empty">Aucun stagiaire n'a encore rejoint la partie.<br>Partagez ce même lien : ils choisiront « Je suis stagiaire ».</div>`;
  }
  if(withNw.length===0){
    return `${statCards}<div class="empty">Aucun stagiaire ne correspond à « ${esc(adminSearch)} ».</div>`;
  }

  const cards = withNw.map(({t,nw})=>{
    const open = expandedTrainee===t.id;
    const holdingsRows = Object.entries(t.holdings||{}).map(([sym,h])=>{
      const s = stocks.find(x=>x.symbol===sym);
      const price = s? s.price : h.avgCost;
      return `<tr><td>${esc(sym)}</td><td>${h.qty}</td><td>${fmt(h.avgCost)}</td><td>${fmt(price)}</td></tr>`;
    }).join("") || `<tr><td colspan="4" class="mono" style="color:var(--muted)">Aucune position</td></tr>`;
    const txRows = (t.transactions||[]).slice(0,6).map(tx=>
      `<tr><td>${tx.type==='achat'?'Achat':'Vente'}</td><td>${esc(tx.name)}</td><td>${tx.qty}</td><td>${fmt(tx.total)}</td></tr>`
    ).join("") || `<tr><td colspan="4" class="mono" style="color:var(--muted)">Aucune transaction</td></tr>`;
    let detail = "";
    if(open){
      const phoneDigits = (t.phone||"").replace(/[^\d+]/g,"");
      detail = `
      <div class="a-trainee-detail">
        <div class="a-section-title" style="margin-top:0;">Contact</div>
        <div class="a-field-row" style="margin-bottom:8px;">
          <input class="a-field-input" type="tel" placeholder="Aucun numéro renseigné" value="${esc(t.phone||'')}" onchange="updateTraineePhone('${t.id}', this.value)">
        </div>
        ${phoneDigits?`<div class="a-btn-row" style="margin-bottom:6px;">
          <a class="a-ghost-btn" style="text-decoration:none;text-align:center;" href="tel:${phoneDigits}">📞 Appeler</a>
          <a class="a-ghost-btn" style="text-decoration:none;text-align:center;" href="https://wa.me/${phoneDigits.replace('+','')}" target="_blank" rel="noopener">WhatsApp</a>
        </div>`:""}
        <div class="a-section-title">Positions</div>
        <table class="a-mini-table"><thead><tr><th>Action</th><th>Qté</th><th>PRU</th><th>Prix</th></tr></thead><tbody>${holdingsRows}</tbody></table>
        <div class="a-section-title">Dernières transactions</div>
        <table class="a-mini-table"><thead><tr><th>Type</th><th>Action</th><th>Qté</th><th>Total</th></tr></thead><tbody>${txRows}</tbody></table>
        <div style="margin-top:12px;"><button class="a-danger-btn" onclick="deleteTrainee('${t.id}')">Réinitialiser ce stagiaire</button></div>
      </div>`;
    }
    return `
    <div class="a-trainee-card">
      <div class="a-trainee-top" onclick="toggleTrainee('${t.id}')">
        <div>
          <div>${esc(t.name)}</div>
          <div class="a-trainee-meta">Mis à jour ${timeAgo(t.updatedAt)}${t.phone?` · ${esc(t.phone)}`:""}</div>
        </div>
        <div style="text-align:right;">
          <div class="mono">${fmt(nw)}</div>
          <div class="a-trainee-meta">liquidités : ${fmt(t.cash)}</div>
        </div>
      </div>
      ${detail}
    </div>`;
  }).join("");

  return `${statCards}
    <div class="a-section-title" style="margin-top:0;">Classement en direct</div>
    ${cards}
    <div class="a-btn-row" style="margin-top:10px;">
      <button class="a-ghost-btn" onclick="deleteAllTrainees()">Réinitialiser tous les stagiaires</button>
    </div>`;
}
function renderMessagesTab(){
  if(adminMessages.length===0){
    return `<div class="empty">Aucun message pour l'instant.<br>Les stagiaires peuvent vous écrire depuis leur onglet « Compte ».</div>`;
  }
  const items = adminMessages.map(m=>`
    <div class="a-trainee-card" style="padding:14px 16px;${m.read?"":"border-color:var(--gold);"}">
      <div class="row" style="align-items:flex-start;">
        <div>
          <div style="font-size:14px;">${esc(m.traineeName)}${m.read?"":" 🔵"}</div>
          <div class="a-trainee-meta">${timeAgo(m.createdAt)}</div>
        </div>
      </div>
      <p style="margin:10px 0 0;font-size:14px;white-space:pre-wrap;">${esc(m.text)}</p>
      <div class="a-btn-row" style="margin-top:10px;">
        ${m.read?"":`<button class="a-ghost-btn" onclick="markMessageRead('${m.id}')">Marquer comme lu</button>`}
        <button class="a-danger-btn" onclick="deleteMessage('${m.id}')">Supprimer</button>
      </div>
    </div>`).join("");
  return `
    <div class="a-btn-row" style="margin-bottom:14px;">
      <button class="a-ghost-btn" onclick="loadMessages().then(render)">${ICONS.reset} Actualiser</button>
      <button class="a-ghost-btn" onclick="deleteAllMessages()">Tout supprimer</button>
    </div>
    ${items}`;
}
function renderParametresTab(){
  const stockRows = draft.stocks.map((s,i)=>`
    <tr>
      <td><input class="a-cell-input mono" style="width:64px" value="${esc(s.symbol)}" onchange="updateStockField(${i},'symbol',this.value)"></td>
      <td><input class="a-cell-input" value="${esc(s.name)}" onchange="updateStockField(${i},'name',this.value)"></td>
      <td><input class="a-cell-input" style="width:100px" value="${esc(s.sector)}" onchange="updateStockField(${i},'sector',this.value)"></td>
      <td><input class="a-cell-input mono" style="width:90px" type="number" min="1" value="${s.price}" onchange="updateStockField(${i},'price',this.value)"></td>
      <td><button class="a-icon-btn" onclick="removeStockRow(${i})" title="Supprimer">✕</button></td>
    </tr>`).join("");
  return `
  <div class="card">
    <div class="a-section-title" style="margin-top:0;">Économie de la simulation</div>
    <div class="a-field-row">
      <div>
        <label class="a-field-label">Solde de départ (XOF)</label>
        <input class="a-field-input mono" type="number" min="0" value="${draft.startCash}" onchange="updateDraftField('startCash', this.value)">
      </div>
      <div>
        <label class="a-field-label">Vitesse du marché (secondes / tick)</label>
        <input class="a-field-input mono" type="number" min="1" value="${draft.tickIntervalSec}" onchange="updateDraftField('tickIntervalSec', this.value)">
      </div>
      <div>
        <label class="a-field-label">Volatilité (0 à 1)</label>
        <input class="a-field-input mono" type="number" step="0.01" min="0" max="1" value="${draft.volatility}" onchange="updateDraftField('volatility', this.value)">
      </div>
    </div>
  </div>
  <div class="card">
    <div class="a-section-title" style="margin-top:0;">Expérience stagiaire</div>
    <label style="display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;">
      <input type="checkbox" ${draft.showLeaderboard?"checked":""} onchange="updateDraftField('showLeaderboard', this.checked)" style="width:16px;height:16px;">
      Afficher un classement en direct aux stagiaires (pseudo et valeur nette, sans les liquidités détaillées)
    </label>
  </div>
  <div class="card">
    <div class="a-section-title" style="margin-top:0;">Actions cotées</div>
    <table class="a-stock-table">
      <thead><tr><th>Symbole</th><th>Nom</th><th>Secteur</th><th>Prix</th><th></th></tr></thead>
      <tbody>${stockRows}</tbody>
    </table>
    <button class="a-add-row-btn" onclick="addStockRow()">+ Ajouter une action</button>
  </div>
  <div class="a-btn-row">
    <button class="a-primary-btn" onclick="saveDraft(true)">Enregistrer et redémarrer le marché</button>
    <button class="a-ghost-btn" onclick="saveDraft(false)">Enregistrer sans redémarrer</button>
  </div>
  <p class="a-warn">Redémarrer le marché remet le « jour boursier » à 1 pour tout le monde et recalcule les prix à partir des valeurs ci-dessus. Les portefeuilles des stagiaires ne sont pas effacés.</p>`;
}
function renderAdminApp(){
  const unread = adminMessages.filter(m=>!m.read).length;
  return `
    <div class="header wide-header">
      <div>
        <p class="eyebrow">Panneau administrateur</p>
        <h1>Le Comptoir Boursier</h1>
      </div>
      <span class="live-pill"><span class="live-dot"></span>en direct</span>
    </div>
    <p class="subtitle" style="padding:0 20px;">Suivi et paramétrage de la simulation — jour boursier ${currentTick()+1}</p>
    <p class="a-warn">Cette page contrôle la partie de tous les stagiaires. Ne communiquez le code administrateur qu'à vous-même.
      <button class="link-btn" style="margin:6px 0 0;display:block;" onclick="goToRole()">← Quitter l'espace administrateur</button>
    </p>
    <div class="a-tabs">
      <button class="a-tab-btn ${adminTab==='stagiaires'?'active':''}" onclick="setAdminTab('stagiaires')">Stagiaires</button>
      <button class="a-tab-btn ${adminTab==='messages'?'active':''}" onclick="setAdminTab('messages')">Messages${unread?` (${unread})`:""}</button>
      <button class="a-tab-btn ${adminTab==='parametres'?'active':''}" onclick="setAdminTab('parametres')">Paramètres</button>
    </div>
    <div class="content" style="padding:0 20px;">
      ${adminTab==='stagiaires'? renderStagiairesTab() : adminTab==='messages'? renderMessagesTab() : renderParametresTab()}
    </div>
    <div id="toast" class="toast"></div>`;
}

/* =========================================================================
   RENDU GLOBAL
   ========================================================================= */
function render(){
  const app = document.getElementById("app");
  app.classList.toggle("wide", screen==="admin");
  if(screen==="role"){ app.innerHTML = renderRoleScreen(); return; }
  if(screen==="adminAuth"){ app.innerHTML = renderAdminAuthScreen(); return; }
  if(screen==="login"){ app.innerHTML = renderLoginScreen(); return; }
  if(screen==="loading"){ app.innerHTML = renderLoadingScreen(); return; }
  if(screen==="admin"){ app.innerHTML = renderAdminApp(); return; }
  app.innerHTML = renderTraineeApp(); // screen === "app"
}

let toastTimer=null;
function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

render();
</script>
</body>
</html>
